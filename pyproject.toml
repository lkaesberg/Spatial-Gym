[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "Spatial-Gym"
version = "1.0.0"
description = "A Gymnasium environment for benchmarking spatial reasoning capabilities of AI agents on grid-based puzzles"
readme = "README.md"
license = { file = "LICENCE" }
authors = [
  { name = "Lars Benedikt Kaesberg", email = "l.kaesberg@uni-goettingen.de" },
  { name = "Tobias Mark", email = "tobi09.mark@gmx.net" }
]
requires-python = ">=3.9"
dependencies = [
  "gymnasium>=0.28.1",
  "numpy>=1.26.4",
  "pygame>=2.2.0",
  "pyyaml>=5.1",
  "pandas>=2.3.1",
  "huggingface-hub>=0.15.0",
  "fsspec>=2025.7.0",
  "chardet>=5.2.0",
  "datasets>=4.1.1"
]
keywords = ["gymnasium", "reinforcement-learning", "spatial-reasoning", "llm-evaluation", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.entry-points."gymnasium.envs"]
Spatial-Gym = "Spatial_Gym.Spatial_Gym:Spatial_Gym"

[project.urls]
Repository = "https://github.com/lkaesberg/Spatial-Gym"
Homepage = "https://github.com/lkaesberg/Spatial-Gym"
Documentation = "https://github.com/lkaesberg/Spatial-Gym#readme"
"Issue Tracker" = "https://github.com/lkaesberg/Spatial-Gym/issues"

[tool.hatch.build.targets.wheel]
packages = ["Spatial_Gym"]

[tool.hatch.metadata]
allow-direct-references = true