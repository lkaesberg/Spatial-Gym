[project]
name = "spatial-gym-env"
version = "0.1.1"
description = "SPaRC grid pathfinding puzzles, solved one move per turn (Spatial-Gym) or in one reply."
requires-python = ">=3.11"
license = "MIT"
tags = ["spatial-reasoning", "multi-turn", "game", "puzzles", "eval", "train"]
dependencies = [
    "verifiers>=0.4.0",
    "Spatial-Gym>=0.1.1",
    "datasets>=3.6.0",
    "gymnasium>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatial_gym_env"]
